name: Build RSS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run generator
        run: python generate_feed.py

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: rss
          path: site/
